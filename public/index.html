<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Occultum · Relic Tracker</title>
<meta name="description" content="Phantom Weapons Occultum (IL 795) progress tracker for Woven, Charli and Mimikyu.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M8 0l5 8-5 8-5-8z' fill='%23e9c77b'/%3E%3Cpath d='M8 2l3 6-3 6z' fill='%239fe7ee'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;900&family=Alegreya+Sans:wght@400;500;700&family=Silkscreen&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#e9c77b; --gold-hi:#fff1c7; --gold-deep:#b0813a;
  --teal:#3fb6c8; --aether:#9fe7ee; --ocean:#0e3d63; --ocean-deep:#071a2e;
  --leaf:#5aa35e; --amber:#d9822b;
  --ink:#dfe8f5; --muted:#8fa4bf;
  --iris:conic-gradient(from 0deg,#9fe7ee,#cdb8ff,#ffc6e6,#fff0b3,#b0f0d2,#9fe7ee);
  --ease-out:cubic-bezier(.2,.9,.2,1);
  --ease-back:cubic-bezier(.34,1.56,.64,1);
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:"Alegreya Sans",system-ui,sans-serif; color:var(--ink);
  background:#040a16; min-height:100vh; overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit}
.sky{position:fixed;inset:0;z-index:-2;
  background:
    radial-gradient(ellipse 120% 55% at 50% 108%, rgba(233,165,80,.38), transparent 62%),
    radial-gradient(ellipse 70% 35% at 18% 100%, rgba(90,163,94,.22), transparent 70%),
    radial-gradient(ellipse 80% 40% at 82% 100%, rgba(63,182,200,.28), transparent 70%),
    linear-gradient(180deg,#030814 0%,#081a31 42%,#0f2c4b 74%,#173f5b 100%);
}
#motes{position:fixed;inset:0;z-index:-1;pointer-events:none}

/* ---------- Hero ---------- */
.hero{position:relative;text-align:center;padding:56px 20px 24px;isolation:isolate}
.ring{position:absolute;left:50%;top:clamp(150px,20vw,190px);width:min(980px,96vw);aspect-ratio:1;translate:-50% -50%;z-index:-1;scale:1 .2;pointer-events:none}
.ring::before{content:"";position:absolute;inset:0;border-radius:50%;background:var(--iris);opacity:.8;
  -webkit-mask:radial-gradient(circle,transparent 66%,#000 67.5%,#000 69.5%,transparent 71%);
          mask:radial-gradient(circle,transparent 66%,#000 67.5%,#000 69.5%,transparent 71%);
  filter:saturate(1.3) drop-shadow(0 0 14px rgba(159,231,238,.6));
  animation:spin 22s linear infinite, ringIn 1.6s var(--ease-out) both}
@keyframes spin{to{rotate:360deg}}
@keyframes ringIn{from{opacity:0;scale:.6}}
.eyebrow{font-family:Cinzel,serif;letter-spacing:.42em;text-transform:uppercase;font-size:12px;color:var(--aether);margin:42px 0 6px;opacity:.9;animation:fadeUp .9s .2s var(--ease-out) both}
h1{margin:0;line-height:.9;font-family:Cinzel,serif}
.t-small{display:block;font-size:clamp(16px,2.6vw,26px);letter-spacing:.32em;font-weight:600;color:var(--gold);text-shadow:0 2px 0 #3d2a10;animation:fadeUp .9s .35s var(--ease-out) both}
.t-big{display:inline-block;font-size:clamp(54px,10vw,118px);font-weight:900;letter-spacing:.06em;
  background:linear-gradient(180deg,#fffaf0 0%,#f6dea0 30%,#d3a24c 52%,#f7e1a6 70%,#a06c25 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 0 #4a3010) drop-shadow(0 0 22px rgba(240,200,120,.35));
  animation:titleIn 1.3s .45s var(--ease-out) both;position:relative}
.t-big::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.9) 50%,transparent 60%);
  -webkit-background-clip:text;background-clip:text;color:transparent;background-size:250% 100%;animation:sheen 6s 2s ease-in-out infinite}
@keyframes titleIn{from{opacity:0;letter-spacing:.4em;filter:blur(8px)}}
@keyframes sheen{0%,70%{background-position:150% 0}100%{background-position:-60% 0}}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}}
.flourish{display:flex;align-items:center;justify-content:center;gap:10px;margin:14px auto 8px;color:var(--gold);animation:fadeUp .9s .7s var(--ease-out) both}
.flourish i{display:block;height:1px;width:min(160px,22vw);background:linear-gradient(90deg,transparent,var(--gold))}
.flourish i:last-child{transform:scaleX(-1)}
.flourish b{width:9px;height:9px;rotate:45deg;background:var(--gold);box-shadow:0 0 12px var(--gold)}
.sub{margin:4px 0 0;color:#c9d6e8;font-size:17px;animation:fadeUp .9s .8s var(--ease-out) both}
.sub em{font-style:normal;color:var(--gold-hi)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:20px;animation:fadeUp .9s .95s var(--ease-out) both}
.pill{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;font-size:14px;
  background:rgba(7,26,46,.7);border:1px solid rgba(233,199,123,.35);backdrop-filter:blur(6px)}
.pill .dot{width:8px;height:8px;rotate:45deg;background:#7a8aa0}
.pill.ok .dot{background:#7cf0b0;box-shadow:0 0 10px #7cf0b0;animation:pulse 2.4s infinite}
.pill.local .dot{background:var(--amber);box-shadow:0 0 10px var(--amber)}
.pill.err .dot{background:#ff6b7d;box-shadow:0 0 10px #ff6b7d}
@keyframes pulse{50%{opacity:.35}}
.seg{display:inline-flex;padding:3px;border-radius:999px;background:rgba(7,26,46,.7);border:1px solid rgba(233,199,123,.35)}
.seg button{border:0;background:none;padding:6px 14px;border-radius:999px;cursor:pointer;font-family:Cinzel,serif;font-weight:600;font-size:13px;letter-spacing:.06em;color:var(--muted);transition:color .25s, background .35s var(--ease-out)}
.seg button.on{color:#1a1206;background:linear-gradient(180deg,#fbe7b0,#d9ab55);box-shadow:0 0 14px rgba(233,199,123,.45)}
.iconbtn{cursor:pointer;border:1px solid rgba(233,199,123,.35);background:rgba(7,26,46,.7);border-radius:999px;padding:8px 13px;font-size:14px;transition:border-color .2s, transform .2s}
.iconbtn:hover{border-color:var(--gold);transform:translateY(-1px)}

/* ---------- Window chrome ---------- */
main{max-width:1180px;margin:0 auto;padding:12px 18px 80px}
.window{position:relative;border-radius:12px;
  background:linear-gradient(180deg,rgba(26,66,110,.88),rgba(8,24,45,.93));
  border:1px solid rgba(233,199,123,.5);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.05),inset 0 1px 0 rgba(255,255,255,.14),0 24px 60px rgba(0,0,0,.45)}
.window::before,.window::after{content:"";position:absolute;width:9px;height:9px;rotate:45deg;background:var(--gold);box-shadow:0 0 8px rgba(233,199,123,.8);z-index:2}
.window::before{top:-5px;left:22px}
.window::after{bottom:-5px;right:22px}

/* ---------- Party cards ---------- */
.party{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-bottom:22px}
.card{all:unset;cursor:pointer;display:block;padding:0 0 16px;position:relative;
  transition:transform .45s var(--ease-back), box-shadow .4s, border-color .4s;
  animation:cardIn .8s var(--ease-out) both;animation-delay:calc(1s + var(--i)*120ms)}
@keyframes cardIn{from{opacity:0;transform:translateY(30px) scale(.96)}}
.card:hover{transform:translateY(-3px)}
.card.active{transform:translateY(-8px);border-color:var(--gold);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),0 0 0 1px rgba(233,199,123,.6),0 0 40px color-mix(in srgb,var(--accent) 45%,transparent),0 24px 60px rgba(0,0,0,.5)}
.card:focus-visible{outline:2px solid var(--aether);outline-offset:4px}
.stage{position:relative;height:178px;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;border-radius:12px 12px 0 0;
  background:radial-gradient(ellipse 60% 70% at 50% 100%,color-mix(in srgb,var(--accent) 30%,transparent),transparent 70%),
             linear-gradient(180deg,rgba(255,255,255,.03),transparent)}
.floor{position:absolute;bottom:10px;left:50%;width:150px;height:34px;translate:-50% 0;border-radius:50%;
  background:var(--iris);opacity:.25;
  -webkit-mask:radial-gradient(closest-side,transparent 70%,#000 74%,#000 86%,transparent 90%);
          mask:radial-gradient(closest-side,transparent 70%,#000 74%,#000 86%,transparent 90%);
  animation:spin 14s linear infinite;transition:opacity .5s}
.card.active .floor{opacity:.85}
.shadow{position:absolute;bottom:16px;left:50%;width:70px;height:12px;translate:-50% 0;border-radius:50%;background:rgba(0,0,0,.45);filter:blur(2px)}
.sprite{position:relative;z-index:1;margin-bottom:16px;line-height:0;animation:bob 1.1s steps(2,jump-none) infinite}
.sprite svg{display:block;filter:drop-shadow(0 0 1px rgba(0,0,0,.6))}
@keyframes bob{50%{transform:translateY(-3px)}}
.sprite.hop{animation:hop .6s var(--ease-out)}
@keyframes hop{30%{transform:translateY(-22px) scaleY(1.05)}60%{transform:translateY(0) scaleY(.92)}80%{transform:translateY(-4px)}}
.weapon{position:absolute;z-index:2;bottom:34px;left:calc(50% + 50px);line-height:0;rotate:14deg;
  --g:0; filter:drop-shadow(0 0 calc(2px + var(--g)*14px) var(--wglow)) drop-shadow(0 0 calc(var(--g)*4px) #fff);
  animation:floaty 3.2s ease-in-out infinite}
@keyframes floaty{50%{translate:0 -8px}}
.card.obtained .weapon{animation:floaty 3.2s ease-in-out infinite, iris 3s linear infinite}
@keyframes iris{to{filter:drop-shadow(0 0 16px #ffc6e6) drop-shadow(0 0 4px #fff) hue-rotate(360deg)}}
.badge-ob{position:absolute;top:12px;right:12px;z-index:3;font-family:Silkscreen,monospace;font-size:11px;padding:4px 8px;border-radius:4px;
  color:#1a1206;background:linear-gradient(180deg,#fff1c7,#d9ab55);box-shadow:0 0 14px rgba(233,199,123,.8);display:none}
.card.obtained .badge-ob{display:block;animation:stampIn .6s var(--ease-back)}
.card-info{padding:12px 18px 0}
.name-row{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.name{font-family:Cinzel,serif;font-weight:700;font-size:22px;color:var(--gold-hi);letter-spacing:.04em}
.job{font-family:Silkscreen,monospace;font-size:12px;padding:3px 7px;border-radius:4px;border:1px solid color-mix(in srgb,var(--accent) 70%,transparent);color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.meta{font-size:13px;color:var(--muted);margin:2px 0 10px}
.gauge-label{display:flex;justify-content:space-between;font-family:Silkscreen,monospace;font-size:11px;color:#b9c8dc;margin-bottom:5px}
.gauge-label b{color:var(--gold-hi);font-weight:400}
.gauge{height:9px;border-radius:5px;background:#05111f;border:1px solid rgba(233,199,123,.35);overflow:hidden;position:relative}
.gauge i{display:block;height:100%;width:var(--p,0%);background:linear-gradient(90deg,#2f8fa3,#9fe7ee 60%,#f0d28c);transition:width 1s var(--ease-out);position:relative}
.gauge i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);width:40%;animation:gaugeShine 2.6s ease-in-out infinite}
@keyframes gaugeShine{from{transform:translateX(-120%)}to{transform:translateX(320%)}}
.gems{display:flex;gap:9px;margin-top:12px;align-items:center}
.gems span{width:10px;height:10px;rotate:45deg;border:1px solid rgba(233,199,123,.55);background:#0a1a2e;transition:all .5s var(--ease-back)}
.gems span.on{background:linear-gradient(135deg,#fff1c7,#e9c77b 50%,#9fe7ee);box-shadow:0 0 10px rgba(233,199,123,.9);scale:1.15}
.gems small{margin-left:auto;font-family:Silkscreen,monospace;font-size:11px;color:var(--muted)}
.card.flash::after{content:"";position:absolute;inset:0;border-radius:12px;pointer-events:none;background:radial-gradient(circle at 50% 40%,rgba(159,231,238,.45),transparent 65%);animation:flash 1s ease-out forwards}
@keyframes flash{from{opacity:1}to{opacity:0}}

/* ---------- Panel ---------- */
.panel{padding:0;overflow:hidden;animation:fadeUp .9s 1.35s var(--ease-out) both}
.panel-head{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:flex-end;justify-content:space-between;padding:20px 24px 0;border-bottom:1px solid rgba(233,199,123,.25);
  background:linear-gradient(180deg,rgba(255,255,255,.04),transparent)}
.ph-title{padding-bottom:14px}
.ph-name{display:block;font-family:Cinzel,serif;font-weight:700;font-size:26px;color:var(--gold-hi)}
.ph-job{font-size:14px;color:var(--muted)}
.ph-job b{color:var(--aether);font-weight:500}
.tabs{display:flex;gap:2px;flex-wrap:wrap}
.tab{border:0;background:none;cursor:pointer;padding:10px 14px 12px;font-family:Cinzel,serif;font-weight:600;font-size:13px;letter-spacing:.06em;color:var(--muted);position:relative;transition:color .25s}
.tab::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);transform:scaleX(0);transition:transform .45s var(--ease-out)}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--gold-hi)}
.tab.on::after{transform:scaleX(1)}
.tab .ct{display:inline-block;margin-left:6px;font-family:Silkscreen,monospace;font-size:10px;padding:2px 5px;border-radius:3px;background:rgba(255,255,255,.07);color:#b9c8dc;vertical-align:1px}
.tab .ct.full{background:linear-gradient(180deg,#fff1c7,#d9ab55);color:#1a1206}
.panel-body{padding:22px 24px 8px;min-height:340px;position:relative}
.pane{animation:paneIn .55s var(--ease-out) both}
.pane.out{animation:paneOut .22s ease-in forwards}
@keyframes paneIn{from{opacity:0;transform:translateX(26px);clip-path:inset(0 0 0 30%)}to{clip-path:inset(0 0 0 0)}}
@keyframes paneOut{to{opacity:0;transform:translateX(-20px)}}
.group{margin-bottom:22px}
.group h3{display:flex;align-items:center;gap:10px;margin:0 0 10px;font-family:Cinzel,serif;font-weight:600;font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.group h3::before{content:"";width:7px;height:7px;rotate:45deg;background:var(--gold)}
.group h3 small{font-family:"Alegreya Sans",sans-serif;text-transform:none;letter-spacing:0;font-weight:400;color:var(--muted);font-size:13px}
.group h3 .gct{margin-left:auto;font-family:Silkscreen,monospace;font-size:11px;letter-spacing:0;color:#b9c8dc}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.row{display:flex;align-items:center;gap:13px;width:100%;text-align:left;cursor:pointer;padding:11px 14px;border-radius:8px;
  background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.07);position:relative;overflow:hidden;
  transition:background .3s, border-color .3s, transform .3s var(--ease-out);
  animation:rowIn .5s var(--ease-out) both;animation-delay:calc(var(--i,0)*28ms)}
@keyframes rowIn{from{opacity:0;transform:translateY(10px)}}
.row:hover{background:rgba(159,231,238,.08);border-color:rgba(233,199,123,.45);transform:translateX(3px)}
.row:focus-visible{outline:2px solid var(--aether);outline-offset:2px}
.row .label{flex:1;font-size:16px;transition:color .3s}
.row .stamp{font-family:Silkscreen,monospace;font-size:10px;color:#1a1206;background:linear-gradient(180deg,#fff1c7,#d9ab55);padding:3px 6px;border-radius:3px;opacity:0;transform:scale(1.8) rotate(-8deg);transition:all .35s var(--ease-back)}
.row.done{background:linear-gradient(90deg,rgba(233,199,123,.17),rgba(233,199,123,.03));border-color:rgba(233,199,123,.4)}
.row.done .label{color:var(--gold-hi)}
.row.done .stamp{opacity:1;transform:none}
.gem{flex:none;width:17px;height:17px;rotate:45deg;border:2px solid rgba(233,199,123,.7);background:#081628;position:relative;transition:background .3s, box-shadow .3s}
.gem::after{content:"";position:absolute;inset:3px;background:transparent;transition:background .3s}
.done .gem{background:linear-gradient(135deg,#fff7dc,#e9c77b 45%,#3fb6c8);box-shadow:0 0 12px rgba(233,199,123,.85);animation:gemPop .5s var(--ease-back)}
.done .gem::after{background:rgba(255,255,255,.55)}
@keyframes gemPop{40%{scale:1.5}}
.row.sweep::before{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,241,199,.55) 50%,transparent 70%);animation:sweep .7s ease-out forwards}
@keyframes sweep{from{transform:translateX(-100%)}to{transform:translateX(100%)}}

/* field ops */
.zones{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.zone{padding:16px;border-radius:10px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.08);animation:rowIn .5s var(--ease-out) both;animation-delay:calc(var(--i,0)*60ms);transition:border-color .4s, box-shadow .4s}
.zone.complete{border-color:rgba(233,199,123,.55);box-shadow:0 0 24px rgba(233,199,123,.12) inset}
.zone h4{margin:0;font-family:Cinzel,serif;font-size:18px;color:var(--gold-hi);display:flex;align-items:center;gap:8px}
.zone h4 .tick{margin-left:auto;font-family:Silkscreen,monospace;font-size:10px;color:#1a1206;background:linear-gradient(180deg,#fff1c7,#d9ab55);padding:3px 6px;border-radius:3px;opacity:0;transition:opacity .4s}
.zone.complete h4 .tick{opacity:1}
.zone .zsub{font-size:13px;color:var(--muted);margin:2px 0 12px}
.fate{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.fate .flabel{font-size:14px;color:#c9d6e8;min-width:92px}
.fate .flabel b{font-family:Silkscreen,monospace;font-weight:400;color:var(--gold-hi);font-size:12px}
.pips{display:flex;gap:9px}
.pip{width:24px;height:24px;border:0;padding:0;background:none;cursor:pointer;display:grid;place-items:center}
.pip i{display:block;width:15px;height:15px;rotate:45deg;border:2px solid rgba(233,199,123,.65);background:#081628;transition:all .35s var(--ease-back)}
.pip:hover i{border-color:var(--gold-hi);scale:1.15}
.pip.on i{background:linear-gradient(135deg,#fff7dc,#f0c860 50%,#d98a2b);border-color:#fff1c7;box-shadow:0 0 12px rgba(240,200,96,.9)}
.pip.pop i{animation:gemPop .45s var(--ease-back)}
.zone .list{grid-template-columns:1fr 1fr;gap:6px}
.zone .row{padding:8px 10px;gap:10px}
.zone .row .label{font-size:14px}
.zone .row .stamp{display:none}
.zone .gem{width:13px;height:13px}

/* final step */
.final{margin:6px 24px 24px;padding:16px 18px;border-radius:10px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;
  border:1px dashed rgba(233,199,123,.45);background:linear-gradient(90deg,rgba(233,199,123,.07),transparent)}
.final .ftxt{flex:1;min-width:240px;font-size:15px;color:#c9d6e8}
.final .ftxt strong{display:block;font-family:Cinzel,serif;color:var(--gold);letter-spacing:.08em;font-size:13px;text-transform:uppercase;margin-bottom:2px}
.final .row{width:auto;flex:none;padding:12px 18px}
.final .row[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.resetbtn{background:none;border:0;color:var(--muted);font-size:13px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.resetbtn:hover{color:#ff9aa8}

/* ---------- Party board ---------- */
.board-tools{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px}
.legend{font-size:14px;color:var(--muted)}
.legend .tag{margin-right:6px}
.check{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:14px;color:#c9d6e8}
.check input{accent-color:var(--gold);width:16px;height:16px}
.board{width:100%;border-collapse:separate;border-spacing:0 4px}
.board th{position:sticky;top:0;z-index:2;background:#0b223d;padding:8px 6px;font-family:Cinzel,serif;font-weight:600;font-size:13px;color:var(--gold)}
.board th:first-child{text-align:left;padding-left:12px}
.board .head{display:flex;flex-direction:column;align-items:center;gap:2px;line-height:0}
.board .head span{line-height:1.2}
.board td{padding:4px 6px;background:rgba(255,255,255,.03);text-align:center;transition:background .3s}
.board td:first-child{text-align:left;padding-left:12px;border-radius:6px 0 0 6px;font-size:15px}
.board td:last-child{border-radius:0 6px 6px 0}
.board tr.sec td{background:none;padding:16px 4px 4px;font-family:Cinzel,serif;color:var(--gold);letter-spacing:.1em;text-transform:uppercase;font-size:13px}
.board tr.need td{background:rgba(63,182,200,.1)}
.board tr.hidden{display:none}
.tag{display:inline-block;font-family:Silkscreen,monospace;font-size:9px;padding:2px 5px;border-radius:3px;background:linear-gradient(180deg,#bff4f8,#3fb6c8);color:#04202a;margin-left:8px;vertical-align:2px}
.board tr:not(.need) .tag{display:none}
.legend .tag{display:inline-block!important}
.cell{border:0;background:none;cursor:pointer;width:38px;height:32px;display:inline-grid;place-items:center;border-radius:6px;transition:background .2s}
.cell:hover{background:rgba(255,255,255,.08)}
.cell.fc{font-family:Silkscreen,monospace;font-size:12px;width:46px;color:#b9c8dc}
.cell.fc.done{color:#1a1206;background:linear-gradient(180deg,#fff1c7,#d9ab55)}
.board-wrap{overflow-x:auto}

/* ---------- FX ---------- */
#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
.spark{position:fixed;width:7px;height:7px;rotate:45deg;background:var(--c);box-shadow:0 0 8px var(--c);
  animation:spark var(--d,.8s) var(--ease-out) forwards}
@keyframes spark{from{transform:translate(0,0) scale(1);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(0) rotate(180deg);opacity:0}}
.ripple{position:fixed;width:10px;height:10px;border-radius:50%;border:2px solid var(--gold-hi);translate:-50% -50%;animation:ripple .6s ease-out forwards}
@keyframes ripple{to{width:90px;height:90px;opacity:0}}
#glove{position:fixed;z-index:40;pointer-events:none;opacity:0;transition:top .18s var(--ease-out),left .18s var(--ease-out),opacity .2s;line-height:0}
#glove.show{opacity:1}
#glove svg{animation:nudge .5s steps(2,jump-none) infinite;filter:drop-shadow(1px 2px 0 rgba(0,0,0,.5))}
@keyframes nudge{50%{transform:translateX(-4px)}}
@media (hover:none){#glove{display:none}}

#toasts{position:fixed;left:50%;bottom:22px;translate:-50% 0;z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{padding:11px 18px 11px 14px;display:flex;align-items:center;gap:10px;font-size:15px;max-width:92vw;animation:toastIn .5s var(--ease-back) both}
.toast.bye{animation:toastOut .35s ease-in forwards}
.toast .ti{line-height:0}
@keyframes toastIn{from{opacity:0;transform:translateY(20px) scale(.9)}}
@keyframes toastOut{to{opacity:0;transform:translateY(12px)}}

.overlay{position:fixed;inset:0;z-index:70;display:grid;place-items:center;background:rgba(2,8,18,.72);backdrop-filter:blur(4px);animation:fade .3s both}
.overlay.bye{animation:fadeOut .3s forwards}
@keyframes fade{from{opacity:0}}
@keyframes fadeOut{to{opacity:0}}
.dialog{padding:26px 28px;max-width:420px;width:92vw;text-align:center;animation:pop .45s var(--ease-back) both}
@keyframes pop{from{opacity:0;transform:scale(.85)}}
.dialog h2{font-family:Cinzel,serif;color:var(--gold-hi);margin:0 0 8px}
.dialog p{color:#c9d6e8;margin:0 0 20px}
.btns{display:flex;gap:10px;justify-content:center}
.btn{cursor:pointer;padding:10px 20px;border-radius:8px;font-family:Cinzel,serif;font-weight:700;letter-spacing:.06em;border:1px solid rgba(233,199,123,.5);background:rgba(255,255,255,.05);transition:transform .2s, box-shadow .2s}
.btn:hover{transform:translateY(-2px)}
.btn.gold{background:linear-gradient(180deg,#fbe7b0,#d9ab55);color:#1a1206;border-color:#fff1c7;box-shadow:0 0 18px rgba(233,199,123,.4)}
.btn.danger{background:linear-gradient(180deg,#ff9aa8,#c42638);color:#fff;border-color:#ffc0c8}

/* celebration */
.cel{position:relative;text-align:center;padding:20px;width:min(820px,96vw)}
.cel h2 .w{white-space:nowrap;font-weight:inherit}
.cel-ring{position:absolute;left:50%;top:40%;width:420px;aspect-ratio:1;translate:-50% -50%;border-radius:50%;background:var(--iris);
  -webkit-mask:radial-gradient(circle,transparent 60%,#000 62%,#000 70%,transparent 72%);mask:radial-gradient(circle,transparent 60%,#000 62%,#000 70%,transparent 72%);
  filter:drop-shadow(0 0 30px #9fe7ee);animation:celRing 1.2s var(--ease-out) both, spin 12s linear infinite;max-width:94vw}
@keyframes celRing{from{scale:.1;opacity:0}}
.cel-rays{position:absolute;left:50%;top:40%;width:700px;height:700px;translate:-50% -50%;max-width:120vw;
  background:repeating-conic-gradient(from 0deg,rgba(255,241,199,.16) 0 6deg,transparent 6deg 18deg);
  -webkit-mask:radial-gradient(circle,#000 10%,transparent 60%);mask:radial-gradient(circle,#000 10%,transparent 60%);animation:spin 30s linear infinite reverse, fade 1s both}
.cel-stage{position:relative;height:250px;display:flex;align-items:flex-end;justify-content:center;gap:10px}
.cel-stage .sprite{animation:victory 1.2s .5s var(--ease-out) both, bob 1.1s 1.7s steps(2,jump-none) infinite}
@keyframes victory{0%{opacity:0;transform:translateY(-120px)}50%{opacity:1;transform:translateY(0) scaleY(.85)}70%{transform:translateY(-26px)}100%{transform:none}}
.cel-stage .wpn{line-height:0;animation:wpnIn 1.4s .9s var(--ease-back) both, iris 3s 2.3s linear infinite;filter:drop-shadow(0 0 16px #fff1c7)}
@keyframes wpnIn{from{opacity:0;transform:translateY(-60px) rotate(-200deg) scale(.3)}}
.cel-kicker{position:relative;font-family:Silkscreen,monospace;color:var(--aether);letter-spacing:.2em;margin:18px 0 6px;animation:fadeUp .6s 1.2s both}
.cel h2{position:relative;margin:0;font-family:Cinzel,serif;font-weight:900;font-size:clamp(26px,5vw,40px);color:var(--gold-hi);text-shadow:0 0 20px rgba(233,199,123,.6),0 3px 0 #4a3010}
.cel h2 span{display:inline-block;animation:letter .5s var(--ease-back) both}
@keyframes letter{from{opacity:0;transform:translateY(20px) scale(1.6);filter:blur(6px)}}
.cel p{position:relative;color:#dfe8f5;font-size:17px;margin:10px 0 22px;animation:fadeUp .6s 2s both}
.cel .btn{position:relative;animation:fadeUp .6s 2.2s both}

@media (max-width:820px){
  .party{grid-template-columns:repeat(3,minmax(230px,1fr));overflow-x:auto;scroll-snap-type:x mandatory;padding:10px 4px 14px;margin:0 -18px 14px;padding-left:18px;padding-right:18px}
  .card{scroll-snap-align:center}
  .panel-head{padding:16px 14px 0}
  .panel-body{padding:18px 14px 6px}
  .final{margin:6px 14px 20px}
  .zone .list{grid-template-columns:1fr}
  .group h3 small{display:none}
  .ring{top:118px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

<body>
<div class="sky"></div>
<canvas id="motes"></canvas>

<header class="hero">
  <div class="ring" aria-hidden="true"></div>

  <h1><span class="t-small">Phantom Weapons</span><span class="t-big">Occultum</span></h1>

<script>
/* ============================================================
   DATA — Final Phantasm objectives (patch 7.55)
   ============================================================ */
const slug = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const ZONES = [
  {id:'urqopacha', name:'Urqopacha', group:'Yok Tural', enemies:['Turali Ratel','Megamaguey','Longjaw','Chirwagur Engraver']},
  {id:'kozamauka', name:"Kozama'uka", group:'Yok Tural', enemies:['Uolon','Ocelot','Paper Wasp','Lesser Apollyon']},
  {id:'yaktel', name:"Yak T'el", group:'Yok Tural', enemies:["Vawtsaral Br'aax","T'ohsoq",'Branchbearer','Blue Leafkin']},
  {id:'shaaloani', name:'Shaaloani', group:'Xak Tural', enemies:['Tumbleclaw','Ceratoraptor','Rroneek','Nopalitender']},
  {id:'heritage-found', name:'Heritage Found', group:'Xak Tural', enemies:['Cauahealoa','Katobleps','Gomphotherium','Woolback']},
  {id:'living-memory', name:'Living Memory', group:'Unlost World', enemies:['Acrocat','Matchlock Scorpion','Everlasting Yew','Fluid Soul']},
];
ZONES.forEach(z => z.enemyItems = z.enemies.map(e => ({id: `${z.id}-${slug(e)}`, name: e})));

const mk = arr => arr.map(n => ({id: slug(n), name: n}));
const SECTIONS = [
  {id:'dungeons', tab:'Dungeons', groups:[
    {name:'Leveling Dungeons', obj:'lvl', items:mk(['Ihuykatumu','Worqor Zormor','The Skydeep Cenote','Vanguard','Origenics'])},
    {name:'Expert Dungeons', obj:'exp', items:mk(['Alexandria','Tender Valley','The Strayborough Deadwalk','Yuweyawata Field Station','The Underkeep','The Meso Terminal','Mistwake','The Clyteum'])},
  ]},
  {id:'trials', tab:'Trials', groups:[
    {name:'Trials', note:"Normal mode · The Windward Wilds doesn't count", obj:'trials', items:mk(['Worqor Lar Dor','Everkeep','The Interphos','Recollection','The Ageless Necropolis','Hell on Rails','The Unmaking'])},
  ]},
  {id:'alliance', tab:'Alliance Raids', groups:[
    {name:"Echoes of Vana'diel", obj:'alliance', items:mk(['Jeuno: The First Walk',"San d'Oria: The Second Walk",'Windurst: The Third Walk'])},
  ]},
  {id:'arcadion', tab:'Arcadion', groups:[
    {name:'Light-heavyweight', note:'Normal mode', obj:'arc', items:[1,2,3,4].map(n=>({id:`aac-lh-m${n}`, name:`Light-heavyweight M${n}`}))},
    {name:'Cruiserweight', note:'Normal mode', obj:'arc', items:[1,2,3,4].map(n=>({id:`aac-cw-m${n}`, name:`Cruiserweight M${n}`}))},
    {name:'Heavyweight', note:'Normal mode', obj:'arc', items:[1,2,3,4].map(n=>({id:`aac-hw-m${n}`, name:`Heavyweight M${n}`}))},
  ]},
];
const ALL_DUTIES = SECTIONS.flatMap(s => s.groups.flatMap(g => g.items));
const TOTAL = ZONES.length*5 + ZONES.length*4 + ALL_DUTIES.length;

const NAMES = {duty:{}, enemy:{}, fate:{}};
ALL_DUTIES.forEach(d => NAMES.duty[d.id] = d.name);
ZONES.forEach(z => { NAMES.fate[z.id] = z.name; z.enemyItems.forEach(e => NAMES.enemy[e.id] = `${e.name} (${z.name})`); });

const zoneDone = (d,z) => (d.fate[z.id]||0) >= 5 && z.enemyItems.every(e => d.enemy[e.id]);
const groupItems = obj => SECTIONS.flatMap(s => s.groups.filter(g => g.obj===obj).flatMap(g => g.items));
const OBJECTIVES = [
  {name:'Yok Tural', test:d => ZONES.filter(z=>z.group==='Yok Tural').every(z=>zoneDone(d,z))},
  {name:'Xak Tural', test:d => ZONES.filter(z=>z.group==='Xak Tural').every(z=>zoneDone(d,z))},
  {name:'Unlost World', test:d => ZONES.filter(z=>z.group==='Unlost World').every(z=>zoneDone(d,z))},
  {name:'Leveling Dungeons', test:d => groupItems('lvl').every(i=>d.duty[i.id])},
  {name:'Expert Dungeons', test:d => groupItems('exp').every(i=>d.duty[i.id])},
  {name:'Trials', test:d => groupItems('trials').every(i=>d.duty[i.id])},
  {name:'Alliance Raids', test:d => groupItems('alliance').every(i=>d.duty[i.id])},
  {name:'The Arcadion', test:d => groupItems('arc').every(i=>d.duty[i.id])},
];

  },
  mimi: {

      "..KUScSSSSSScUK.",

      "..KSKUUGGUUKSK..",

      "...KwWWUUWWwK...",

    pal:{K:'#1b1024',F:'#f7f3ff',M:'#d548b4',G:'#e9c46a',l:'#b08ae6',U:'#7b4fb4',u:'#57348e',S:'#f7d9c4',s:'#e2b49c',b:'#4a6be0',c:'#f3a2b0',W:'#efe8fb',w:'#cbbde8',B:'#2a2232',k:'#7a4a2a'},
  },
};
const WEAPONS = {
  rapier:["...K...","..KMK..","..KMK..","..KmK..","..KMK..","..KMK..","..KmK..","..KMK..","..KMK..","..KmK..","..KMK..","..KMK..",".KKGKK.","KGGCGGK",".KGGGK.","..KNK..","..KNK..","..KNK..","..KGK..","...K..."],
  brush:["...K...","..KPK..",".KPPPK.",".KYYYK.",".KTTTK.",".KWWWK.","..KWK..",".KGGGK.","..KGK..","..KNK..","..KnK..","..KNK..","..KnK..","..KNK..","..KnK..","..KNK..","..KnK..","..KNK..",".KGGGK.","..KKK.."],

const GLOVE = {rows:[

  "KWWWWWWWWWWK",
  "KWWgWWKKKKK.",

const CHARS = [
  {id:'woven', name:'Woven', job:'Red Mage', abbr:'RDM', race:'Hyur', weapon:'Phantom Degen Occultum', accent:'#b07cf5', scale:6,
   wsprite:'rapier', wpal:{K:'#160f1f',M:'#d7b8ff',m:'#8a5ad8',G:'#c9a24e',C:'#b46cff',N:'#2b1d18'}, wglow:'#b46cff', head:13},
  {id:'charli', name:'Charli', job:'Red Mage', abbr:'RDM', race:"Miqo'te", weapon:'Phantom Degen Occultum', accent:'#f47aa8', scale:6,
   wsprite:'rapier', wpal:{K:'#1b1024',M:'#eef3fa',m:'#9fb0c8',G:'#e9c46a',C:'#ff3b5c',N:'#5a2a1c'}, wglow:'#ff6b8a', head:12},
  {id:'mimi', name:'Mimikyu', job:'Pictomancer', abbr:'PCT', race:'Lalafell', weapon:'Phantom Round Brush Occultum', accent:'#5fd3e0', scale:5,
   wsprite:'brush', wpal:{K:'#1b1024',P:'#ff6fb0',Y:'#ffd65a',T:'#4fd8e0',W:'#f7f3ff',G:'#e9c46a',N:'#8a5a34',n:'#6a4226'}, wglow:'#ffc6e6', head:16},
];
const CHAR = Object.fromEntries(CHARS.map(c => [c.id, c]));

function pixelSVG(rows, pal, scale, crop){
  const h = crop || rows.length, w = rows[0].length; let r = '';
  for (let y=0; y<h; y++){
    const row = rows[y]; let x = 0;
    while (x < w){
      const ch = row[x]; if (ch === '.'){ x++; continue; }
      let x2 = x; while (x2 < w && row[x2] === ch) x2++;
      r += `<rect x="${x}" y="${y}" width="${x2-x}" height="1" fill="${pal[ch]||'#f0f'}"/>`;
      x = x2;
    }
  }
  return `<svg viewBox="0 0 ${w} ${h}" width="${w*scale}" height="${h*scale}" shape-rendering="crispEdges" aria-hidden="true">${r}</svg>`;
}
const spriteOf = (c, scale) => pixelSVG(SPRITES[c.id].rows, SPRITES[c.id].pal, scale ?? c.scale);
const headOf = (c, scale=2) => pixelSVG(SPRITES[c.id].rows, SPRITES[c.id].pal, scale, c.head);
const weaponOf = (c, scale=4) => pixelSVG(WEAPONS[c.wsprite], c.wpal, scale);

/* ============================================================
   STATE + SYNC
   ============================================================ */
const API = '/api/progress';
const LOCAL_KEY = 'occultum-local-v1';
const blank = () => ({duty:{}, enemy:{}, fate:{}, final:{}, updatedAt:0});
const norm = d => ({...blank(), ...(d||{}), duty:{...(d?.duty||{})}, enemy:{...(d?.enemy||{})}, fate:{...(d?.fate||{})}, final:{...(d?.final||{})}});
const state = Object.fromEntries(CHARS.map(c => [c.id, blank()]));
const pending = {};
let mode = 'connecting';        // 'remote' | 'local'
let firstLoad = true;
const ui = {view:'char', sel: localStorage.getItem('occultum-sel') || 'woven', tab:'field', hideCleared:false};
if (!CHAR[ui.sel]) ui.sel = 'woven';

function setSync(kind, text){
  const el = document.getElementById('sync');
  el.className = 'pill ' + kind;
  document.getElementById('syncText').textContent = text;
}

async function poll(){
  try {
    const r = await fetch(API, {cache:'no-store', headers:{accept:'application/json'}});
    if (!r.ok) throw new Error(r.status);
    const j = await r.json();
    if (!j || !j.chars) throw new Error('bad');
    mode = 'remote';
    for (const c of CHARS){
      if (pending[c.id]) continue;
      const incoming = norm(j.chars[c.id]);
      if (incoming.updatedAt !== state[c.id].updatedAt){
        const before = state[c.id];
        state[c.id] = incoming;
        if (!firstLoad) announceRemote(c, before, incoming);
      }
    }
    setSync('ok', 'Linkshell synced');
    firstLoad = false;
    syncUI();
  } catch (e){
    if (mode !== 'remote'){
      if (mode !== 'local'){
        mode = 'local';
        try { const saved = JSON.parse(localStorage.getItem(LOCAL_KEY)||'{}'); CHARS.forEach(c => state[c.id] = norm(saved[c.id])); } catch {}
        syncUI();
      }
      setSync('local', 'Offline preview · saving on this device');
    } else {
      setSync('err', 'Reconnecting…');
    }
    firstLoad = false;
  }
}

async function push(char, payload, tries=0){
  if (mode === 'local'){
    state[char].updatedAt = Date.now();
    localStorage.setItem(LOCAL_KEY, JSON.stringify(state));
    return;
  }
  pending[char] = (pending[char]||0) + 1;
  try {
    const r = await fetch(API, {method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({char, ...payload})});
    if (!r.ok) throw new Error(r.status);
    const j = await r.json();
    pending[char]--;
    if (!pending[char]){ state[char] = norm(j.data); syncUI(); }
    setSync('ok', 'Linkshell synced');
  } catch (e){
    pending[char]--;
    if (tries < 3){ setSync('err', 'Retrying save…'); setTimeout(() => push(char, payload, tries+1), 1500*(tries+1)); }
    else { toast('Couldn’t save that change — check your connection.', null); poll(); }
  }
}

/* ============================================================
   PROGRESS
   ============================================================ */
function progressOf(id){
  const d = state[id]; let done = 0;
  ZONES.forEach(z => { done += Math.min(5, d.fate[z.id]||0); z.enemyItems.forEach(e => { if (d.enemy[e.id]) done++; }); });
  ALL_DUTIES.forEach(i => { if (d.duty[i.id]) done++; });
  return {done, pct: done/TOTAL, objs: OBJECTIVES.map(o => o.test(d))};
}
function tabCounts(id, tab){
  const d = state[id];
  if (tab === 'field'){
    let done = 0; ZONES.forEach(z => { done += Math.min(5,d.fate[z.id]||0); z.enemyItems.forEach(e => d.enemy[e.id] && done++); });
    return [done, ZONES.length*9];
  }
  const items = SECTIONS.find(s => s.id===tab).groups.flatMap(g => g.items);
  return [items.filter(i => d.duty[i.id]).length, items.length];
}

/* ============================================================
   RENDER
   ============================================================ */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];

function renderParty(){
  $('#party').innerHTML = CHARS.map((c,i) => `
    <button class="card window" data-select="${c.id}" style="--accent:${c.accent};--i:${i}" aria-label="Select ${esc(c.name)}">
      <span class="badge-ob">IL 795 ✦</span>
      <div class="stage">
        <div class="floor"></div><div class="shadow"></div>
        <div class="sprite">${spriteOf(c)}</div>
        <div class="weapon" style="--wglow:${c.wglow}">${weaponOf(c)}</div>
      </div>
      <div class="card-info">
        <div class="name-row"><span class="name">${esc(c.name)}</span><span class="job">${c.abbr}</span></div>
        <div class="meta">Lv 100 ${esc(c.job)} · ${esc(c.race)}</div>
        <div class="gauge-label"><span>MEMORIES</span><b class="gnum">0/${TOTAL}</b></div>
        <div class="gauge"><i></i></div>
        <div class="gems">${OBJECTIVES.map(o=>`<span title="${esc(o.name)}"></span>`).join('')}<small class="gpct">0%</small></div>
      </div>
    </button>`).join('');
}

function rowBtn(kind, id, label, i, char){
  return `<button class="row" data-kind="${kind}" data-id="${id}"${char?` data-char="${char}"`:''} style="--i:${i}" aria-pressed="false">
    <span class="gem"></span><span class="label">${esc(label)}</span><span class="stamp">CLEAR</span></button>`;
}

function renderPanel(animate=true){
  const panel = $('#panel');
  if (ui.view === 'board'){ renderBoard(panel); return; }
  const c = CHAR[ui.sel];
  const tabs = [{id:'field', tab:'Field Ops'}, ...SECTIONS];
  panel.innerHTML = `
    <div class="panel-head">
      <div class="ph-title"><span class="ph-name">${esc(c.name)}'s Knowledge Crystal</span>
        <span class="ph-job">${esc(c.job)} · forging <b>${esc(c.weapon)}</b> · any job counts</span></div>
      <div class="tabs" role="tablist">${tabs.map(t => `<button class="tab${t.id===ui.tab?' on':''}" role="tab" data-tab="${t.id}" aria-selected="${t.id===ui.tab}">${esc(t.tab)}<span class="ct" data-ct="${t.id}"></span></button>`).join('')}</div>
    </div>
    <div class="panel-body"><div class="pane">${paneHTML()}</div></div>
    <div class="final">
      <div class="ftxt"><strong>Final step</strong>Bring the attuned crystal to Gerolt in Phantom Village, choose your attributes and claim <em>${esc(c.weapon)}</em>.</div>
      ${rowBtn('final','obtained','Occultum obtained',0).replace('CLEAR','IL 795')}
      <button class="resetbtn" data-reset>Reset ${esc(c.name)}</button>
    </div>`;
  syncUI();
}

function paneHTML(){
  if (ui.tab === 'field'){
    const groups = ['Yok Tural','Xak Tural','Unlost World'];
    let i = 0;
    return groups.map(g => `
      <div class="group"><h3>${g}<small>Gold-rank 5 FATEs &amp; defeat each target per zone</small></h3>
      <div class="zones">${ZONES.filter(z=>z.group===g).map(z => `
        <div class="zone" data-zone="${z.id}" style="--i:${i++}">
          <h4>${esc(z.name)}<span class="tick">DONE</span></h4>
          <div class="zsub">${esc(g)}</div>
          <div class="fate"><span class="flabel">Gold FATEs <b data-fcount="${z.id}">0/5</b></span>
            <div class="pips">${[1,2,3,4,5].map(n => `<button class="pip" data-zone="${z.id}" data-n="${n}" aria-label="${n} gold FATEs in ${esc(z.name)}"><i></i></button>`).join('')}</div></div>
          <div class="list">${z.enemyItems.map((e,k) => rowBtn('enemy', e.id, e.name, k)).join('')}</div>
        </div>`).join('')}</div></div>`).join('');
  }
  const sec = SECTIONS.find(s => s.id === ui.tab);
  let i = 0;
  return sec.groups.map(g => `
    <div class="group"><h3>${esc(g.name)}${g.note?`<small>${esc(g.note)}</small>`:''}<span class="gct" data-gct="${g.items.map(x=>x.id).join(',')}"></span></h3>
    <div class="list">${g.items.map(it => rowBtn('duty', it.id, it.name, i++)).join('')}</div></div>`).join('');
}

function switchTab(tab){
  if (tab === ui.tab) return;
  ui.tab = tab;
  $$('.tab').forEach(t => { const on = t.dataset.tab === tab; t.classList.toggle('on', on); t.setAttribute('aria-selected', on); });
  const body = $('.panel-body'), old = $('.pane', body);
  sfx('tab');
  old.classList.add('out');
  setTimeout(() => { body.innerHTML = `<div class="pane">${paneHTML()}</div>`; syncUI(); }, 200);
}

function renderBoard(panel){
  const heads = CHARS.map(c => `<th><div class="head">${headOf(c, 2.5)}<span>${esc(c.name)}</span></div></th>`).join('');
  let rows = '';
  rows += `<tr class="sec"><td colspan="4">Field Operations</td></tr>`;
  ZONES.forEach(z => {
    rows += `<tr data-row="fate:${z.id}"><td>${esc(z.name)} · Gold FATEs<span class="tag">PARTY UP</span></td>${CHARS.map(c=>`<td><button class="cell fc" data-char="${c.id}" data-fatecycle="${z.id}" title="Click to add a FATE">0/5</button></td>`).join('')}</tr>`;
    z.enemyItems.forEach(e => {
      rows += `<tr data-row="enemy:${e.id}"><td>${esc(e.name)} <small style="color:var(--muted)">· ${esc(z.name)}</small><span class="tag">PARTY UP</span></td>${CHARS.map(c=>`<td><button class="cell" data-char="${c.id}" data-kind="enemy" data-id="${e.id}" aria-label="${esc(c.name)}: ${esc(e.name)}"><span class="gem"></span></button></td>`).join('')}</tr>`;
    });
  });
  SECTIONS.forEach(s => s.groups.forEach(g => {
    rows += `<tr class="sec"><td colspan="4">${esc(g.name)}</td></tr>`;
    g.items.forEach(it => {
      rows += `<tr data-row="duty:${it.id}"><td>${esc(it.name)}<span class="tag">PARTY UP</span></td>${CHARS.map(c=>`<td><button class="cell" data-char="${c.id}" data-kind="duty" data-id="${it.id}" aria-label="${esc(c.name)}: ${esc(it.name)}"><span class="gem"></span></button></td>`).join('')}</tr>`;
    });
  }));
  panel.innerHTML = `
    <div class="panel-head"><div class="ph-title"><span class="ph-name">Party Board</span><span class="ph-job">Everyone at a glance · tick anyone's box</span></div></div>
    <div class="panel-body"><div class="pane">
      <div class="board-tools">
        <span class="legend"><span class="tag">PARTY UP</span> all three still need it — queue together</span>
        <label class="check"><input type="checkbox" id="hideCleared" ${ui.hideCleared?'checked':''}> Hide what everyone's cleared</label>
      </div>
      <div class="board-wrap"><table class="board"><thead><tr><th>Objective</th>${heads}</tr></thead><tbody>${rows}</tbody></table></div>
    </div></div>`;
  syncUI();
}

/* Update every live element from state, without re-rendering */
function syncUI(){
  CHARS.forEach(c => {
    const card = $(`.card[data-select="${c.id}"]`); if (!card) return;
    const p = progressOf(c.id);
    card.classList.toggle('active', ui.view==='char' && ui.sel===c.id);
    card.classList.toggle('obtained', !!state[c.id].final.obtained);
    $('.gauge i', card).style.setProperty('--p', (p.pct*100).toFixed(1)+'%');
    $('.gnum', card).textContent = `${p.done}/${TOTAL}`;
    $('.gpct', card).textContent = Math.round(p.pct*100)+'%';
    $$('.gems span', card).forEach((g,i) => g.classList.toggle('on', p.objs[i]));
    $('.weapon', card).style.setProperty('--g', p.pct.toFixed(3));
  });
  // checkable rows / cells
  $$('[data-kind][data-id]').forEach(el => {
    const ch = el.dataset.char || ui.sel, d = state[ch][el.dataset.kind] || {};
    const on = !!d[el.dataset.id];
    el.classList.toggle('done', on); el.setAttribute('aria-pressed', on);
  });
  if (ui.view === 'char'){
    const d = state[ui.sel];
    $$('.pip').forEach(p => p.classList.toggle('on', (d.fate[p.dataset.zone]||0) >= +p.dataset.n));
    $$('[data-fcount]').forEach(el => el.textContent = `${Math.min(5,d.fate[el.dataset.fcount]||0)}/5`);
    $$('.zone').forEach(z => z.classList.toggle('complete', zoneDone(d, ZONES.find(x=>x.id===z.dataset.zone))));
    $$('[data-ct]').forEach(el => { const [a,b] = tabCounts(ui.sel, el.dataset.ct); el.textContent = `${a}/${b}`; el.classList.toggle('full', a===b); });
    $$('[data-gct]').forEach(el => { const ids = el.dataset.gct.split(','); el.textContent = `${ids.filter(i=>d.duty[i]).length}/${ids.length}`; });
    const fin = $('.final .row'); if (fin){ const full = progressOf(ui.sel).done === TOTAL; fin.disabled = !full && !d.final.obtained; fin.title = full ? '' : 'Fill the crystal first'; }
  } else {
    $$('[data-fatecycle]').forEach(el => { const n = Math.min(5, state[el.dataset.char].fate[el.dataset.fatecycle]||0); el.textContent = `${n}/5`; el.classList.toggle('done', n>=5); });
    $$('tr[data-row]').forEach(tr => {
      const [kind,id] = tr.dataset.row.split(':');
      const states = CHARS.map(c => kind==='fate' ? (state[c.id].fate[id]||0) >= 5 : !!state[c.id][kind][id]);
      tr.classList.toggle('need', states.every(s => !s));
      tr.classList.toggle('hidden', ui.hideCleared && states.every(s => s));
    });
  }
}

/* ============================================================
   ACTIONS
   ============================================================ */
function setField(char, kind, id, value, el){
  const d = state[char];
  const before = progressOf(char);
  d[kind] = {...d[kind]};
  if (value === false || value === 0) delete d[kind][id]; else d[kind][id] = value;
  const after = progressOf(char);
  syncUI();
  const positive = kind==='fate' ? true : value;
  if (el) fxAt(el, positive);
  sfx(positive ? 'check' : 'uncheck');
  if (positive) hopSprite(char);
  after.objs.forEach((on,i) => { if (on && !before.objs[i]) toast(`Memory attuned: <b>${esc(OBJECTIVES[i].name)}</b>`, char); });
  if (after.done === TOTAL && before.done < TOTAL) setTimeout(() => celebrate(char, 'crystal'), 450);
  if (kind === 'final' && value) setTimeout(() => celebrate(char, 'weapon'), 250);
  push(char, {kind, id, value});
}

function hopSprite(char){
  const s = $(`.card[data-select="${char}"] .sprite`); if (!s) return;
  s.classList.remove('hop'); void s.offsetWidth; s.classList.add('hop');
  setTimeout(() => s.classList.remove('hop'), 650);
}

document.addEventListener('click', e => {
  const t = e.target.closest('button, input');
  if (!t) return;
  if (t.dataset.select){
    const changed = ui.sel !== t.dataset.select || ui.view !== 'char';
    ui.sel = t.dataset.select; localStorage.setItem('occultum-sel', ui.sel);
    hopSprite(ui.sel); sfx('select');
    if (changed){ ui.view = 'char'; setViewButtons(); renderPanel(); }
    if (window.innerWidth < 820) $('#panel').scrollIntoView({behavior:'smooth', block:'start'});
    return;
  }
  if (t.dataset.tab) return switchTab(t.dataset.tab);
  if (t.dataset.view){ ui.view = t.dataset.view; setViewButtons(); sfx('tab'); renderPanel(); syncUI(); return; }
  if (t.dataset.reset !== undefined) return confirmReset();
  if (t.id === 'hideCleared'){ ui.hideCleared = t.checked; syncUI(); return; }
  if (t.dataset.kind && t.dataset.id){
    if (t.disabled) return;
    const char = t.dataset.char || ui.sel, kind = t.dataset.kind;
    const cur = !!state[char][kind][t.dataset.id];
    if (t.classList.contains('row')){ t.classList.remove('sweep'); void t.offsetWidth; if (!cur) t.classList.add('sweep'); }
    setField(char, kind, t.dataset.id, !cur, t);
    return;
  }
  if (t.classList.contains('pip')){
    const z = t.dataset.zone, n = +t.dataset.n, cur = state[ui.sel].fate[z]||0;
    const next = cur === n ? n-1 : n;
    $$(`.pip[data-zone="${z}"]`).forEach(p => { if (+p.dataset.n <= next && +p.dataset.n > cur){ p.classList.remove('pop'); void p.offsetWidth; p.classList.add('pop'); } });
    setField(ui.sel, 'fate', z, next, t);
    if (next < cur) sfx('uncheck');
    return;
  }
  if (t.dataset.fatecycle){
    const ch = t.dataset.char, z = t.dataset.fatecycle, cur = state[ch].fate[z]||0;
    setField(ch, 'fate', z, cur >= 5 ? 0 : cur+1, t);
    return;
  }
});

function setViewButtons(){
  $$('.seg button').forEach(b => b.classList.toggle('on', b.dataset.view === ui.view));
}

function confirmReset(){
  const c = CHAR[ui.sel];
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML = `<div class="dialog window" role="dialog" aria-modal="true">
    <h2>Shatter the crystal?</h2>
    <p>This clears all of ${esc(c.name)}'s Occultum progress for everyone. It can't be undone.</p>
    <div class="btns"><button class="btn" data-no>Cancel</button><button class="btn danger" data-yes>Reset</button></div></div>`;
  document.body.appendChild(ov);
  const close = () => { ov.classList.add('bye'); setTimeout(() => ov.remove(), 300); };
  ov.addEventListener('click', e => {
    if (e.target === ov || e.target.closest('[data-no]')) close();
    if (e.target.closest('[data-yes]')){
      state[c.id] = blank(); syncUI(); close(); sfx('uncheck');
      if (mode === 'local') push(c.id, {}); else push(c.id, {action:'reset'});
      toast(`${esc(c.name)}'s crystal has been reset.`, c.id);
    }
  });
  $('[data-no]', ov).focus();
}

/* ============================================================
   REMOTE NOTICES
   ============================================================ */
function announceRemote(c, before, after){
  const gained = [];
  ['duty','enemy'].forEach(k => Object.keys(after[k]).forEach(id => { if (after[k][id] && !before[k][id]) gained.push(NAMES[k][id] || id); }));
  Object.keys(after.fate).forEach(z => { if ((after.fate[z]||0) > (before.fate[z]||0)) gained.push(`${after.fate[z]}/5 FATEs in ${NAMES.fate[z]}`); });
  const card = $(`.card[data-select="${c.id}"]`);
  if (card){ card.classList.remove('flash'); void card.offsetWidth; card.classList.add('flash'); }
  if (after.final.obtained && !before.final.obtained){ setTimeout(() => celebrate(c.id, 'weapon'), 300); return; }
  if (gained.length){
    hopSprite(c.id); sfx('remote');
    toast(gained.length === 1 ? `<b>${esc(c.name)}</b> cleared ${esc(gained[0])}` : `<b>${esc(c.name)}</b> cleared ${gained.length} objectives`, c.id);
    const bp = progressOf.call(null, c.id); if (bp.done === TOTAL) setTimeout(() => celebrate(c.id, 'crystal'), 400);
  }
}

function toast(html, char){
  const el = document.createElement('div');
  el.className = 'toast window';
  el.innerHTML = `${char ? `<span class="ti">${headOf(CHAR[char], 1.6)}</span>` : '<span class="ti">✦</span>'}<span>${html}</span>`;
  $('#toasts').appendChild(el);
  setTimeout(() => { el.classList.add('bye'); setTimeout(() => el.remove(), 360); }, 3600);
}

/* ============================================================
   CELEBRATION
   ============================================================ */
function celebrate(char, kind){
  const c = CHAR[char];
  const title = kind === 'weapon' ? c.weapon : 'Crystal Fully Attuned';
  const kicker = kind === 'weapon' ? 'ITEM LEVEL 795 · OBTAINED' : 'ALL MARTIAL MEMORIES GATHERED';
  const body = kind === 'weapon'
    ? `${esc(c.name)}'s Phantom weapon has reached its final form!`
    : `${esc(c.name)} is ready. Take the Knowledge Crystal to Gerolt in Phantom Village.`;
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML = `<div class="cel">
    <div class="cel-rays"></div><div class="cel-ring"></div>
    <div class="cel-stage"><div class="sprite">${spriteOf(c, c.scale+2)}</div><div class="wpn">${weaponOf(c, 6)}</div></div>
    <div class="cel-kicker">${kicker}</div>
    <h2>${(() => { let i = 0; return title.split(' ').map(w => `<b class="w">${[...w].map(ch => `<span style="animation-delay:${1.3 + (i++)*0.035}s">${esc(ch)}</span>`).join('')}</b>`).join(' '); })()}</h2>
    <p>${body}</p>
    <button class="btn gold">Continue</button></div>`;
  document.body.appendChild(ov);
  sfx('fanfare');
  const burst = () => { const r = ov.querySelector('.cel-stage').getBoundingClientRect(); sparks(r.left + r.width/2, r.top + r.height/2, 60, 340); };
  setTimeout(burst, 900); setTimeout(burst, 1600);
  const close = () => { ov.classList.add('bye'); setTimeout(() => ov.remove(), 300); };
  ov.addEventListener('click', e => { if (e.target === ov || e.target.closest('.btn')) close(); });
  setTimeout(() => ov.querySelector('.btn')?.focus(), 2300);
}

/* ============================================================
   FX
   ============================================================ */
const SPARK_COLORS = ['#fff1c7','#e9c77b','#9fe7ee','#cdb8ff','#ffc6e6'];
function sparks(x, y, n=16, spread=90){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const fx = $('#fx');
  for (let i=0; i<n; i++){
    const s = document.createElement('span');
    const a = Math.random()*Math.PI*2, d = spread*(.35 + Math.random()*.65);
    s.className = 'spark';
    s.style.cssText = `left:${x}px;top:${y}px;--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d - spread*.2}px;--c:${SPARK_COLORS[i%SPARK_COLORS.length]};--d:${.6+Math.random()*.6}s`;
    fx.appendChild(s);
    setTimeout(() => s.remove(), 1300);
  }
}
function fxAt(el, positive){
  const r = el.getBoundingClientRect();
  const gem = el.querySelector('.gem, i') || el;
  const g = gem.getBoundingClientRect();
  const x = g.left + g.width/2, y = g.top + g.height/2;
  const rp = document.createElement('span'); rp.className = 'ripple'; rp.style.left = x+'px'; rp.style.top = y+'px';
  $('#fx').appendChild(rp); setTimeout(() => rp.remove(), 650);
  if (positive) sparks(x, y, 18, 80);
}

/* glove cursor */
$('#glove').innerHTML = pixelSVG(GLOVE.rows, GLOVE.pal, 3);
function pointAt(el){
  const g = $('#glove');
  if (!el){ g.classList.remove('show'); return; }
  const r = el.getBoundingClientRect();
  let y = r.top + r.height/2 - 12, x = r.left - 40;
  if (el.classList.contains('card')){ const n = el.querySelector('.name').getBoundingClientRect(); x = n.left - 42; y = n.top + n.height/2 - 12; }
  if (x < 2) x = 2;
  g.style.left = x+'px'; g.style.top = y+'px'; g.classList.add('show');
}
const POINTABLE = '.row:not([disabled]), .pip, .card, .tab, .cell, .seg button, .btn';
document.addEventListener('mouseover', e => { const t = e.target.closest(POINTABLE); pointAt(t); });
document.addEventListener('focusin', e => { const t = e.target.closest(POINTABLE); if (t && t.matches(':focus-visible')) pointAt(t); });
window.addEventListener('scroll', () => $('#glove').classList.remove('show'), {passive:true});

/* sound — small original chimes via WebAudio */
let soundOn = localStorage.getItem('occultum-sound') === 'on', actx;
function setSoundBtn(){ const b = $('#soundBtn'); b.textContent = soundOn ? '🔊 Sound' : '🔇 Sound'; b.setAttribute('aria-pressed', soundOn); }
$('#soundBtn').addEventListener('click', () => { soundOn = !soundOn; localStorage.setItem('occultum-sound', soundOn?'on':'off'); setSoundBtn(); sfx('select'); });
setSoundBtn();
const SFX = {
  check:[[987.8,1318.5],'triangle',.06,.18], uncheck:[[523.3,392],'triangle',.07,.12], select:[[659.3,880],'sine',.05,.12],
  tab:[[740],'sine',.0,.07], remote:[[784,987.8,1174.7],'sine',.07,.18],
  fanfare:[[523.3,659.3,784,1046.5,784,1046.5,1318.5,1568],'triangle',.11,.32],
};
function sfx(name){
  if (!soundOn) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const [notes, type, gap, dur] = SFX[name], t0 = actx.currentTime + .01;
    notes.forEach((f,i) => {
      const o = actx.createOscillator(), g = actx.createGain(), t = t0 + i*gap;
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.07, t+.012); g.gain.exponentialRampToValueAtTime(.0001, t+dur);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t+dur+.03);
    });
  } catch {}
}

/* aether motes */
(function motes(){
  const cv = $('#motes'), cx = cv.getContext('2d');
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  let W, H, ps = [];
  const resize = () => { W = cv.width = innerWidth*devicePixelRatio; H = cv.height = innerHeight*devicePixelRatio; cv.style.width = innerWidth+'px'; cv.style.height = innerHeight+'px'; };
  resize(); addEventListener('resize', resize);
  const cols = ['233,199,123','159,231,238','205,184,255','255,198,230'];
  for (let i=0; i<70; i++) ps.push({x:Math.random(), y:Math.random(), r:Math.random()*1.8+.4, v:Math.random()*.00035+.0001, s:Math.random()*Math.PI*2, c:cols[i%cols.length]});
  (function frame(t){
    cx.clearRect(0,0,W,H);
    for (const p of ps){
      p.y -= p.v; if (p.y < -.02){ p.y = 1.02; p.x = Math.random(); }
      const x = (p.x + Math.sin(t/4000 + p.s)*.01)*W, y = p.y*H, a = .25 + .35*Math.sin(t/900 + p.s)**2;
      cx.beginPath(); cx.fillStyle = `rgba(${p.c},${a})`; cx.shadowColor = `rgba(${p.c},.9)`; cx.shadowBlur = 8*devicePixelRatio;
      cx.arc(x, y, p.r*devicePixelRatio, 0, Math.PI*2); cx.fill();
    }
    requestAnimationFrame(frame);
  })(0);
})();

/* ============================================================
   BOOT
   ============================================================ */
renderParty();
setViewButtons();
renderPanel();
poll();
setInterval(() => { if (!document.hidden && mode !== 'local') poll(); }, 3000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && mode !== 'local') poll(); });
